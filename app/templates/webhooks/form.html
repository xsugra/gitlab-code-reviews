{% extends "base.html" %}
{% block title %}{{ 'Edit' if config else 'New' }} Webhook • Code Review Bot{% endblock %}
{% block content %}
<h2>{{ 'Edit Webhook Configuration' if config else 'New Webhook Configuration' }}</h2>

{% if error %}
<div class="flash flash-error">{{ error }}</div>
{% endif %}

<article>
    <form method="post"
          action="{{ '/code-review-bot/webhooks/' ~ config.id if config else '/code-review-bot/webhooks' }}">
        <input type="hidden" name="csrf_token" value="{{ session.csrf }}">

        <label for="project_id">
            Project ID
            <input type="number" id="project_id" name="project_id" min="1" required
                   value="{{ config.project_id if config else '' }}"
                   placeholder="e.g. 34"
                   {{ 'readonly' if config else '' }}
            aria-describedby="project_id_help">
            <small id="project_id_help">
                Find this in GitLab: project Settings &rarr; General &rarr; Project ID.
                {% if config %}Cannot be changed after creation.{% endif %}
            </small>
        </label>

        <label for="project_name">
            Project Name
            <input type="text" id="project_name" name="project_name"
                   value="{{ config.project_name if config else '' }}"
                   placeholder="e.g. web/my-project"
                   aria-describedby="project_name_help">
            <small id="project_name_help">Optional. Used for display purposes only.</small>
        </label>

        <label for="webhook_url">
            Google Chat Webhook URL
            <input type="url" id="webhook_url" name="webhook_url" required
                   value="{{ config.webhook_url if config else '' }}"
                   placeholder="https://chat.googleapis.com/v1/spaces/..."
                   aria-describedby="webhook_url_help">
            <small id="webhook_url_help">
                This URL contains sensitive credentials. Get it from Google Chat: Space settings &rarr; Manage webhooks.
            </small>
        </label>

        <label>
            <input type="checkbox" name="enabled" value="true"
                   {{ 'checked' if (config and config.enabled) or not config else '' }}>
            Enabled
        </label>

        <label for="ignore_patterns">
            Ignore Patterns (.reviewignore)
            <textarea id="ignore_patterns" name="ignore_patterns" rows="6"
                      placeholder="*.lock&#10;package-lock.json&#10;**/*.min.js"
                      aria-describedby="ignore_patterns_help">{{config.ignore_patterns if config else '' }}</textarea>
            <small id="ignore_patterns_help">One pattern per line. Supports glob syntax (e.g.<code>*.lock</code>, <code>dist/**</code>).
                Lines starting with <code>#</code> are comments.</small>
        </label>

        <label for="model">
            Model override
            <div class="combobox" data-combobox>
                <div class="combobox-field">
                    <input type="text" id="model" name="model" value="{{ config.model if config else '' }}"
                           class="combobox-input" data-combobox-input autocomplete="off" spellcheck="false"
                           placeholder="Default: {{ default_model }}" aria-describedby="help_model"
                           role="combobox" aria-expanded="false" aria-autocomplete="list">
                    <button type="button" class="combobox-toggle" data-combobox-toggle
                            aria-label="Show installed models" tabindex="-1">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                             stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
                    </button>
                </div>
                <div class="combobox-panel" data-combobox-panel hidden>
                    <div class="combobox-panel-header">
                        Installed models{% if installed_models %} · {{ installed_models|length }}{% endif %}
                    </div>
                    <ul class="combobox-list" data-combobox-list role="listbox">
                        {% for m in installed_models %}
                        <li class="combobox-option" role="option" data-value="{{ m }}" aria-selected="false">
                            <svg class="combobox-option-icon" width="15" height="15" viewBox="0 0 24 24" fill="none"
                                 stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/>
                                <polyline points="3.27 6.96 12 12.01 20.73 6.96"/>
                                <line x1="12" y1="22.08" x2="12" y2="12"/>
                            </svg>
                            <span class="combobox-option-name">{{ m.split(':')[0] }}</span>
                            {% if ':' in m %}<span class="combobox-option-tag">{{ m.split(':', 1)[1] }}</span>{% endif %}
                            <svg class="combobox-check" width="16" height="16" viewBox="0 0 24 24" fill="none"
                                 stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                <polyline points="20 6 9 17 4 12"/>
                            </svg>
                        </li>
                        {% endfor %}
                    </ul>
                    <div class="combobox-empty" data-combobox-empty {% if installed_models %}hidden{% endif %}>
                        {% if installed_models %}No match — press Enter to use a custom name.{% else %}No models installed in Ollama. Type a name to use one you'll pull later.{% endif %}
                    </div>
                </div>
                <span class="combobox-status" data-combobox-status></span>
            </div>
            <small id="help_model">Leave empty to use the global default model ({{ default_model }}).</small>
        </label>

        <div style="display:flex;gap:0.5rem;margin-top:1rem">
            <button type="submit">{{ 'Update' if config else 'Create' }}</button>
            <a href="/code-review-bot/webhooks" role="button" class="outline secondary">Cancel</a>
        </div>
    </form>
</article>
{% endblock %}
