{% extends "base.html" %}
{% block title %}Login — Code Review Bot{% endblock %}
{% block body_class %}login-page{% endblock %}
{% block body %}
<article class="login-card">
    <img src="/static/logo.png" alt="Code Review Bot" style="width:80px;height:80px;margin-bottom:1rem">
    <h1>Code Review Bot</h1>
    <p>Enter the admin password to manage settings and webhooks.</p>
    {% if error %}
    <div class="flash flash-error">{{ error }}</div>
    {% endif %}
    <form method="post" action="/code-review-bot/login">
        <input type="password" name="password" placeholder="Admin password" required autofocus
               aria-label="Admin password">
        <button type="submit">Sign in</button>
    </form>
</article>
{% endblock %}
